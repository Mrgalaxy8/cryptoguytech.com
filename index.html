
<!DOCTYPE html>

    <script>
      // Gracefully capture and suppress external Web3 extension connection errors (e.g. MetaMask in sandboxed iframes)
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.toLowerCase().includes('metamask') ||
          msg.toLowerCase().includes('failed to connect') ||
          msg.includes('chrome-extension://') ||
          msg.includes('moz-extension://')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          console.warn('[Extension Guard] Prevented unhandled wallet extension error from bubbling:', msg);
        }
      }, true);

      window.addEventListener('error', function (event) {
        var msg = (event && event.message) || '';
        var filename = (event && event.filename) || '';
        if (
          msg.toLowerCase().includes('metamask') ||
          msg.toLowerCase().includes('failed to connect') ||
          filename.includes('extension') ||
          filename.includes('inpage.js')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          console.warn('[Extension Guard] Prevented wallet extension error from bubbling:', msg);
          return true;
        }
      }, true);
    </script>
